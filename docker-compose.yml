services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerops
      POSTGRES_USER: ledgerops
      POSTGRES_PASSWORD: ledgerops
    ports:
      - "5432:5432"
    volumes:
      - ledgerops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerops -d ledgerops"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://ledgerops:ledgerops@database:5432/ledgerops?sslmode=disable
      ALLOWED_ORIGIN: http://localhost:5173
      SEED_DEMO: "true"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: ./backend
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://ledgerops:ledgerops@database:5432/ledgerops?sslmode=disable
      WORKER_POLL_INTERVAL: 1s
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  ledgerops-postgres:

